<title>Corbel Songbook</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0f1420;
    --ground: #141a28;
    --panel: #1a2233;
    --panel-2: #202a3d;
    --edge: #2c3852;
    --edge-soft: #24304698;
    --parch: #ece3cf;
    --parch-dim: #b9b3a1;
    --text: #ded8c8;
    --text-soft: #a6a290;
    --gold: #c9a55c;
    --gold-bright: #e0bd76;
    --sea: #7bb0a2;
    --sea-deep: #4d7d72;
    --wine: #a85a5f;
    --shadow: 0 18px 48px -22px #000c;
    --serif-display: "Cormorant", "Georgia", serif;
    --serif-roman: "Cinzel", "Times New Roman", serif;
    --serif-src: "EB Garamond", "Georgia", serif;
    --serif-zh: "Noto Serif SC", "Songti SC", "SimSun", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 78% -8%, #1c2740 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #17231f 0%, transparent 55%),
      var(--ground);
    color: var(--text);
    font-family: var(--serif-src);
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ---------- layout shell ---------- */
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: 268px 1fr;
    gap: 40px;
    align-items: start;
  }

  /* ---------- hero ---------- */
  .hero {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 16px 40px;
    position: relative;
  }
  .hero .kicker {
    font-family: var(--serif-roman);
    letter-spacing: .42em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold);
    margin: 0 0 20px;
    padding-left: .42em;
  }
  .hero h1 {
    font-family: var(--serif-display);
    font-weight: 500;
    font-size: clamp(46px, 8vw, 88px);
    line-height: .96;
    margin: 0;
    color: var(--parch);
    text-wrap: balance;
    letter-spacing: .01em;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--gold-bright);
  }
  .hero .sub {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: clamp(18px, 2.6vw, 23px);
    color: var(--text-soft);
    margin: 22px auto 0;
    max-width: 44ch;
    text-wrap: balance;
  }
  .rule {
    width: 96px; height: 1px;
    margin: 30px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    position: relative;
  }
  .rule::after {
    content: "❧";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--ground);
    color: var(--gold);
    padding: 0 12px;
    font-size: 14px;
  }

  /* ---------- sidebar / nav ---------- */
  .side {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    align-self: start;
  }
  .side-inner {
    background: linear-gradient(180deg, var(--panel), var(--ink));
    border: 1px solid var(--edge);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .side h2 {
    font-family: var(--serif-roman);
    font-size: 12px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--edge-soft);
  }
  .albums { list-style: none; margin: 0; padding: 8px; }
  .album { margin: 0 0 2px; }
  .album > button {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: none;
    border: 0;
    color: var(--parch);
    font-family: var(--serif-display);
    font-size: 20px;
    text-align: left;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .18s;
  }
  .album > button:hover { background: #ffffff0a; }
  .album > button .yr {
    font-family: var(--serif-src);
    font-size: 12px;
    color: var(--parch-dim);
    letter-spacing: .04em;
  }
  .tracks { list-style: none; margin: 0 0 6px; padding: 0 8px 4px 14px; }
  .tracks li { margin: 0; }
  .tracks button {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--text-soft);
    font-family: var(--serif-src);
    font-size: 15.5px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 0 4px 4px 0;
    transition: color .15s, border-color .15s, background .15s;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .tracks button:hover { color: var(--parch); background: #ffffff07; }
  .tracks button.active {
    color: var(--gold-bright);
    border-left-color: var(--gold);
    background: #c9a55c14;
  }
  .tracks button .lang {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--sea);
    opacity: .8;
    flex: none;
  }
  .tracks button .todo {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--parch-dim);
    border: 1px solid var(--edge);
    border-radius: 20px;
    padding: 1px 7px;
    flex: none;
  }

  /* ---------- main song panel ---------- */
  .main { min-width: 0; }

  .song-head {
    margin: 4px 0 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--edge-soft);
  }
  .song-head .album-tag {
    font-family: var(--serif-roman);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--sea);
    margin: 0 0 10px;
  }
  .song-head h2 {
    font-family: var(--serif-display);
    font-weight: 500;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.02;
    margin: 0;
    color: var(--parch);
    text-wrap: balance;
  }
  .song-head .meta {
    margin: 14px 0 0;
    font-size: 14.5px;
    color: var(--text-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    font-style: italic;
    font-family: var(--serif-display);
  }
  .song-head .meta b {
    font-style: normal;
    font-weight: 400;
    color: var(--gold);
    font-family: var(--serif-roman);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-right: 6px;
  }

  .note {
    background: #1d2740;
    border: 1px solid var(--edge);
    border-left: 3px solid var(--sea-deep);
    border-radius: 4px;
    padding: 14px 18px;
    margin: 0 0 30px;
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 16px;
    color: var(--text-soft);
  }
  .note b {
    font-style: normal;
    color: var(--sea);
    font-family: var(--serif-roman);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  /* stanza grid */
  .lyrics { display: flex; flex-direction: column; gap: 26px; }
  .stanza {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 40px;
    padding: 4px 0;
    position: relative;
  }
  .stanza::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 4px; bottom: 4px;
    width: 1px;
    background: var(--edge-soft);
    transform: translateX(-50%);
  }
  .orig, .trans { min-width: 0; }
  .orig {
    font-family: var(--serif-src);
    font-size: 18px;
    color: var(--parch);
  }
  .orig .line { display: block; }
  .orig i { color: var(--gold); font-style: italic; }
  .trans {
    font-family: var(--serif-zh);
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--text);
  }
  .trans .line { display: block; }
  .trans.empty {
    font-family: var(--serif-display);
    font-style: italic;
    color: var(--parch-dim);
    opacity: .5;
    align-self: center;
  }
  .stanza.chorus .orig,
  .stanza.chorus .trans { padding-left: 14px; border-left: 2px solid var(--gold); }
  .stanza.chorus .orig { color: var(--gold-bright); }
  .stanza .role {
    grid-column: 1 / -1;
    font-family: var(--serif-roman);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--sea);
    margin-bottom: -6px;
  }

  /* placeholder empty state for whole song */
  .placeholder {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--edge);
    border-radius: 6px;
    background: #ffffff05;
  }
  .placeholder p {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 18px;
    color: var(--text-soft);
    max-width: 50ch;
    margin: 0 auto 6px;
  }
  .placeholder .how {
    font-family: var(--serif-src);
    font-style: normal;
    font-size: 14px;
    color: var(--parch-dim);
    margin-top: 16px;
  }

  footer {
    grid-column: 1 / -1;
    text-align: center;
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--edge-soft);
    color: var(--parch-dim);
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 14px;
  }
  footer .harp { color: var(--gold); font-style: normal; font-size: 18px; }

  /* mobile nav toggle */
  .mobile-bar { display: none; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; gap: 0; }
    .hero { padding: 44px 8px 24px; }
    .side {
      position: static;
      margin-bottom: 8px;
    }
    .side-inner.collapsed .albums { display: none; }
    .mobile-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: none; border: 0;
      color: var(--gold);
      font-family: var(--serif-roman);
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: 12px;
      padding: 16px 20px;
      cursor: pointer;
    }
    .stanza { grid-template-columns: 1fr; gap: 6px; }
    .stanza::before { display: none; }
    .orig { padding-bottom: 8px; border-bottom: 1px dotted var(--edge); }
    .main { padding-top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="wrap">
  <header class="hero">
    <p class="kicker">Le Cahier de Chansons</p>
    <h1>Cécile <em>Corbel</em></h1>
    <p class="sub">凯尔特竖琴与旧世界的歌 — 专辑歌词原文与私藏中文翻译</p>
    <div class="rule"></div>
  </header>

  <nav class="side">
    <div class="side-inner" id="sideInner">
      <button class="mobile-bar" id="mobileBar" aria-expanded="true">
        <span>专辑目录 · Sommaire</span>
        <span id="mobileCaret">▾</span>
      </button>
      <h2>Songbooks</h2>
      <ul class="albums" id="albumList"></ul>
    </div>
  </nav>

  <main class="main" id="main"></main>

  <footer>
    <div class="harp">♪</div>
    Un cahier privé · 私人歌本 · 仅供个人欣赏与学习
  </footer>
</div>

         chorus: false,              // true = 副歌样式（金色竖线高亮）
         orig: ["原文第一行", "原文第二行"],
         trans: ["译文第一行", "译文第二行"] }   // 留空 [] 则显示"待译"
     ]

          { role:"Verse 2", chorus:false,

/* ---------- render ---------- */
const albumList = document.getElementById("albumList");
const main = document.getElementById("main");
let current = null;

function songId(ai, si){ return "s"+ai+"_"+si; }

function buildNav(){
  ALBUMS.forEach((al, ai) => {
    const li = document.createElement("li");
    li.className = "album";
    const btn = document.createElement("button");
    btn.innerHTML = `<span>${al.title} <span class="yr">${al.vol} · ${al.year}</span></span>`;
    li.appendChild(btn);
    const ul = document.createElement("ul");
    ul.className = "tracks";
    al.songs.forEach((s, si) => {
      const tli = document.createElement("li");
      const tb = document.createElement("button");
      tb.id = "nav_"+songId(ai,si);
      const done = Array.isArray(s.lyrics) && s.lyrics.length;
      tb.innerHTML = `<span>${s.t}</span>` +
        (done ? `<span class="lang">${s.lang||""}</span>`
              : `<span class="todo">待录</span>`);
      tb.addEventListener("click", () => selectSong(ai, si));
      tli.appendChild(tb);
      ul.appendChild(tli);
    });
    li.appendChild(ul);
    albumList.appendChild(li);
  });
}

function selectSong(ai, si){
  const al = ALBUMS[ai], s = al.songs[si];
  document.querySelectorAll(".tracks button").forEach(b => b.classList.remove("active"));
  const nav = document.getElementById("nav_"+songId(ai,si));
  if (nav) nav.classList.add("active");
  current = [ai,si];

  let html = `<div class="song-head">
      <p class="album-tag">${al.title} ${al.vol} · ${al.year}</p>
      <h2>${s.t}</h2>
      <div class="meta"><span><b>原文</b>${langName(s.lang)}</span></div>
    </div>`;

  if (s.note) {
    html += `<div class="note"><b>Note · 备注</b>${s.note}</div>`;
  }

  if (Array.isArray(s.lyrics) && s.lyrics.length) {
    html += `<div class="lyrics">`;
    s.lyrics.forEach(st => {
      html += `<div class="stanza${st.chorus ? " chorus":""}">`;
      if (st.role) html += `<div class="role">${st.role}</div>`;
      html += `<div class="orig">${(st.orig||[]).map(l=>`<span class="line">${l||"&nbsp;"}</span>`).join("")}</div>`;
      const hasT = st.trans && st.trans.length && st.trans.some(x=>x&&x.trim());
      html += hasT
        ? `<div class="trans">${st.trans.map(l=>`<span class="line">${l||"&nbsp;"}</span>`).join("")}</div>`
        : `<div class="trans empty">待译…</div>`;
      html += `</div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="placeholder">
      <p>这首《${s.t}》还没有录入歌词。</p>
      <p class="how">把它的原文歌词贴给 Claude，就会翻译好、按原文／中文逐段对照填进这里。</p>
    </div>`;
  }

  main.innerHTML = html;
  main.scrollIntoView({behavior:"smooth", block:"start"});
  // collapse mobile nav after pick
  if (window.matchMedia("(max-width: 860px)").matches){
    sideInner.classList.add("collapsed");
    mobileBar.setAttribute("aria-expanded","false");
    mobileCaret.textContent = "▸";
  }
  try { localStorage.setItem("cc_last", ai+","+si); } catch(e){}
}

function langName(code){
  const m = {EN:"英语",FR:"法语",BR:"布列塔尼语","FR/BR":"法语／布列塔尼语",
    IT:"意大利语","LA/IT":"拉丁语／意大利语",ES:"西班牙语",SCO:"苏格兰语",
    GD:"苏格兰盖尔语","GD/EN":"苏格兰盖尔语／英语","EN/FR":"英语／法语","Instr.":"器乐"};
  return " · " + (m[code] || code || "—");
}

/* mobile toggle */
const sideInner = document.getElementById("sideInner");
const mobileBar = document.getElementById("mobileBar");
const mobileCaret = document.getElementById("mobileCaret");
mobileBar.addEventListener("click", () => {
  const c = sideInner.classList.toggle("collapsed");
  mobileBar.setAttribute("aria-expanded", String(!c));
  mobileCaret.textContent = c ? "▸" : "▾";
});

buildNav();
// open last-viewed, else the demo song (Jenovefa)
let start = [3,3];
try {
  const saved = localStorage.getItem("cc_last");
  if (saved){ const [a,b]=saved.split(",").map(Number);
    if (ALBUMS[a] && ALBUMS[a].songs[b]) start=[a,b]; }
} catch(e){}
selectSong(start[0], start[1]);
</script>

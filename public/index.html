<title>Corbel Songbook</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0f1420;
    --ground: #141a28;
    --panel: #1a2233;
    --panel-2: #202a3d;
    --edge: #2c3852;
    --edge-soft: #24304698;
    --parch: #ece3cf;
    --parch-dim: #b9b3a1;
    --text: #ded8c8;
    --text-soft: #a6a290;
    --gold: #c9a55c;
    --gold-bright: #e0bd76;
    --sea: #7bb0a2;
    --sea-deep: #4d7d72;
    --wine: #a85a5f;
    --shadow: 0 18px 48px -22px #000c;
    --serif-display: "Cormorant", "Georgia", serif;
    --serif-roman: "Cinzel", "Times New Roman", serif;
    --serif-src: "EB Garamond", "Georgia", serif;
    --serif-zh: "Noto Serif SC", "Songti SC", "SimSun", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 78% -8%, #1c2740 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #17231f 0%, transparent 55%),
      var(--ground);
    color: var(--text);
    font-family: var(--serif-src);
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ---------- layout shell ---------- */
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: 268px 1fr;
    gap: 40px;
    align-items: start;
  }

  /* ---------- hero ---------- */
  .hero {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 16px 40px;
    position: relative;
  }
  .hero .kicker {
    font-family: var(--serif-roman);
    letter-spacing: .42em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold);
    margin: 0 0 20px;
    padding-left: .42em;
  }
  .hero h1 {
    font-family: var(--serif-display);
    font-weight: 500;
    font-size: clamp(46px, 8vw, 88px);
    line-height: .96;
    margin: 0;
    color: var(--parch);
    text-wrap: balance;
    letter-spacing: .01em;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--gold-bright);
  }
  .hero .sub {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: clamp(18px, 2.6vw, 23px);
    color: var(--text-soft);
    margin: 22px auto 0;
    max-width: 44ch;
    text-wrap: balance;
  }
  .rule {
    width: 96px; height: 1px;
    margin: 30px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    position: relative;
  }
  .rule::after {
    content: "❧";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--ground);
    color: var(--gold);
    padding: 0 12px;
    font-size: 14px;
  }

  /* ---------- sidebar / nav ---------- */
  .side {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    align-self: start;
  }
  .side-inner {
    background: linear-gradient(180deg, var(--panel), var(--ink));
    border: 1px solid var(--edge);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .side h2 {
    font-family: var(--serif-roman);
    font-size: 12px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--edge-soft);
  }
  .albums { list-style: none; margin: 0; padding: 8px; }
  .album { margin: 0 0 2px; }
  .album > button {
    width: 100%;
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: none;
    border: 0;
    color: var(--parch);
    font-family: var(--serif-display);
    font-size: 20px;
    text-align: left;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .18s;
  }
  .album > button:hover { background: #ffffff0a; }
  .album > button .caret {
    flex: none;
    margin-left: auto;
    font-size: 11px;
    line-height: 1;
    color: var(--parch-dim);
    transition: transform .2s ease, color .18s;
    transform: rotate(0deg);
  }
  .album.open > button .caret { transform: rotate(90deg); color: var(--gold); }
  .album > button:hover .caret { color: var(--parch); }
  .album > button .yr {
    font-family: var(--serif-src);
    font-size: 12px;
    color: var(--parch-dim);
    letter-spacing: .04em;
  }
  .tracks {
    list-style: none;
    margin: 0 0 6px;
    padding: 0 8px 4px 14px;
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows .24s ease, opacity .2s ease, margin .24s ease;
  }
  .tracks > .tracks-inner { overflow: hidden; min-height: 0; }
  .album.open > .tracks { grid-template-rows: 1fr; opacity: 1; }
  .album:not(.open) > .tracks { margin-bottom: 0; }
  .tracks li { margin: 0; }
  .tracks button {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--text-soft);
    font-family: var(--serif-src);
    font-size: 15.5px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 0 4px 4px 0;
    transition: color .15s, border-color .15s, background .15s;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .tracks button:hover { color: var(--parch); background: #ffffff07; }
  .tracks button.active {
    color: var(--gold-bright);
    border-left-color: var(--gold);
    background: #c9a55c14;
  }
  .tracks button .lang {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--sea);
    opacity: .8;
    flex: none;
  }
  .tracks button .todo {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--parch-dim);
    border: 1px solid var(--edge);
    border-radius: 20px;
    padding: 1px 7px;
    flex: none;
  }

  /* ---------- main song panel ---------- */
  .main { min-width: 0; }

  .song-head {
    margin: 4px 0 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--edge-soft);
  }
  .song-head .album-tag {
    font-family: var(--serif-roman);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--sea);
    margin: 0 0 10px;
  }
  .song-head h2 {
    font-family: var(--serif-display);
    font-weight: 500;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.02;
    margin: 0;
    color: var(--parch);
    text-wrap: balance;
  }
  .song-head .meta {
    margin: 14px 0 0;
    font-size: 14.5px;
    color: var(--text-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    font-style: italic;
    font-family: var(--serif-display);
  }
  .song-head .meta b {
    font-style: normal;
    font-weight: 400;
    color: var(--gold);
    font-family: var(--serif-roman);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-right: 6px;
  }

  .note {
    background: #1d2740;
    border: 1px solid var(--edge);
    border-left: 3px solid var(--sea-deep);
    border-radius: 4px;
    padding: 14px 18px;
    margin: 0 0 30px;
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 16px;
    color: var(--text-soft);
  }
  .note b {
    font-style: normal;
    color: var(--sea);
    font-family: var(--serif-roman);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  /* stanza grid */
  .lyrics { display: flex; flex-direction: column; gap: 26px; }
  .stanza {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 40px;
    padding: 4px 0;
    position: relative;
  }
  .stanza::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 4px; bottom: 4px;
    width: 1px;
    background: var(--edge-soft);
    transform: translateX(-50%);
  }
  .stanza.trans-only { grid-template-columns: 1fr; }
  .stanza.trans-only::before { display: none; }
  .orig, .trans { min-width: 0; }
  .orig {
    font-family: var(--serif-src);
    font-size: 18px;
    color: var(--parch);
  }
  .orig .line { display: block; }
  .orig i { color: var(--gold); font-style: italic; }
  .trans {
    font-family: var(--serif-zh);
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--text);
  }
  .trans .line { display: block; }
  .trans.empty {
    font-family: var(--serif-display);
    font-style: italic;
    color: var(--parch-dim);
    opacity: .5;
    align-self: center;
  }
  .stanza.chorus .orig,
  .stanza.chorus .trans { padding-left: 14px; border-left: 2px solid var(--gold); }
  .stanza.chorus .orig { color: var(--gold-bright); }
  .stanza .role {
    grid-column: 1 / -1;
    font-family: var(--serif-roman);
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--sea);
    margin-bottom: -6px;
  }

  /* placeholder empty state for whole song */
  .placeholder {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--edge);
    border-radius: 6px;
    background: #ffffff05;
  }
  .placeholder p {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 18px;
    color: var(--text-soft);
    max-width: 50ch;
    margin: 0 auto 6px;
  }
  .placeholder .how {
    font-family: var(--serif-src);
    font-style: normal;
    font-size: 14px;
    color: var(--parch-dim);
    margin-top: 16px;
  }

  footer {
    grid-column: 1 / -1;
    text-align: center;
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--edge-soft);
    color: var(--parch-dim);
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 14px;
  }
  footer .harp { color: var(--gold); font-style: normal; font-size: 18px; }

  /* mobile nav toggle */
  .mobile-bar { display: none; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; gap: 0; }
    .hero { padding: 44px 8px 24px; }
    .side {
      position: static;
      margin-bottom: 8px;
    }
    .side-inner.collapsed .albums { display: none; }
    .mobile-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: none; border: 0;
      color: var(--gold);
      font-family: var(--serif-roman);
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: 12px;
      padding: 16px 20px;
      cursor: pointer;
    }
    .stanza { grid-template-columns: 1fr; gap: 6px; }
    .stanza::before { display: none; }
    .orig { padding-bottom: 8px; border-bottom: 1px dotted var(--edge); }
    .main { padding-top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="wrap">
  <header class="hero">
    <p class="kicker">Le Cahier de Chansons</p>
    <h1>Cécile <em>Corbel</em></h1>
    <p class="sub">凯尔特竖琴与旧世界的歌 — 专辑歌词原文与私藏中文翻译</p>
    <div class="rule"></div>
  </header>

  <nav class="side">
    <div class="side-inner" id="sideInner">
      <button class="mobile-bar" id="mobileBar" aria-expanded="true">
        <span>专辑目录 · Sommaire</span>
        <span id="mobileCaret">▾</span>
      </button>
      <h2>Songbooks</h2>
      <ul class="albums" id="albumList"></ul>
    </div>
  </nav>

  <main class="main" id="main"></main>

  <footer>
    <div class="harp">♪</div>
    Un cahier privé · 私人歌本 · 仅供个人欣赏与学习
  </footer>
</div>

<script src="data/albums.js"></script>
<script>

/* ---------- render ---------- */
const albumList = document.getElementById("albumList");
const main = document.getElementById("main");
let current = null;

function songId(ai, si){ return "s"+ai+"_"+si; }

/* ---- 跨专辑同曲：ref 引用同一份数据 ---- */
// 建立 id → {song, album} 索引（源歌需带唯一 id）
const SONG_BY_ID = {};
ALBUMS.forEach(al => al.songs.forEach(s => { if (s.id) SONG_BY_ID[s.id] = { song: s, album: al }; }));
// 解析一首歌：若带 ref，则借用源歌的 lyrics/lang/transOnly（本条目自己的 t/note/lang 优先），
// 并返回源歌所属专辑信息，供页面标注「与《…》同曲」。
function resolveSong(s){
  if (!s || !s.ref) return { song: s, sameAs: null };
  const src = SONG_BY_ID[s.ref];
  if (!src) return { song: s, sameAs: null };   // 源不存在则退化为原样（避免崩）
  const merged = {
    t: s.t || src.song.t,
    lang: s.lang || src.song.lang,
    note: s.note || src.song.note,
    transOnly: ('transOnly' in s) ? s.transOnly : src.song.transOnly,
    lyrics: src.song.lyrics
  };
  return { song: merged, sameAs: src.album };
}

function buildNav(){
  ALBUMS.forEach((al, ai) => {
    const li = document.createElement("li");
    li.className = "album";
    const btn = document.createElement("button");
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = `<span>${al.title} <span class="yr">${al.vol} · ${al.year}</span></span>` +
      `<span class="caret" aria-hidden="true">▸</span>`;
    btn.addEventListener("click", () => toggleAlbum(ai));
    li.appendChild(btn);
    const ul = document.createElement("ul");
    ul.className = "tracks";
    const inner = document.createElement("div");
    inner.className = "tracks-inner";
    ul.appendChild(inner);
    al.songs.forEach((s, si) => {
      const tli = document.createElement("li");
      const tb = document.createElement("button");
      tb.id = "nav_"+songId(ai,si);
      const rs = resolveSong(s).song;          // 解析 ref，用源歌判断是否已录
      const done = Array.isArray(rs.lyrics) && rs.lyrics.length;
      tb.innerHTML = `<span>${s.t}</span>` +
        (done ? `<span class="lang">${langLabel(rs.lang)}</span>`
              : `<span class="todo">待录</span>`);
      tb.addEventListener("click", () => selectSong(ai, si));
      tli.appendChild(tb);
      inner.appendChild(tli);
    });
    li.appendChild(ul);
    albumList.appendChild(li);
  });
}

function toggleAlbum(ai){
  const li = albumList.children[ai];
  if (!li) return;
  const open = li.classList.toggle("open");
  const btn = li.querySelector("button");
  if (btn) btn.setAttribute("aria-expanded", String(open));
}

function openAlbum(ai){
  const li = albumList.children[ai];
  if (!li || li.classList.contains("open")) return;
  li.classList.add("open");
  const btn = li.querySelector("button");
  if (btn) btn.setAttribute("aria-expanded", "true");
}

function selectSong(ai, si){
  const al = ALBUMS[ai], raw = al.songs[si];
  const resolved = resolveSong(raw);
  const s = resolved.song;                 // 解析后的歌（ref 已借用源歌数据）
  openAlbum(ai);
  document.querySelectorAll(".tracks button").forEach(b => b.classList.remove("active"));
  const nav = document.getElementById("nav_"+songId(ai,si));
  if (nav) nav.classList.add("active");
  current = [ai,si];

  let html = `<div class="song-head">
      <p class="album-tag">${al.title} ${al.vol} · ${al.year}</p>
      <h2>${s.t}</h2>
      <div class="meta"><span><b>${s.transOnly ? "语言" : "原文"}</b>${langName(s.lang)}${s.transOnly ? " · 仅中文译文" : ""}</span></div>
    </div>`;

  if (resolved.sameAs) {
    const src = resolved.sameAs;
    html += `<div class="note"><b>同曲 · Same Song</b>与《${src.title}${src.vol ? " "+src.vol : ""}》中的同名曲为同一录音，歌词共用一份数据。</div>`;
  }

  if (s.note) {
    html += `<div class="note"><b>Note · 备注</b>${s.note}</div>`;
  }

  if (Array.isArray(s.lyrics) && s.lyrics.length) {
    html += `<div class="lyrics">`;
    const noOrig = s.transOnly || s.lyrics.every(st => !(st.orig && st.orig.length));
    s.lyrics.forEach(st => {
      html += `<div class="stanza${st.chorus ? " chorus":""}${noOrig ? " trans-only":""}">`;
      if (st.role) html += `<div class="role">${st.role}</div>`;
      if (!noOrig)
        html += `<div class="orig">${(st.orig||[]).map(l=>`<span class="line">${l||"&nbsp;"}</span>`).join("")}</div>`;
      const hasT = st.trans && st.trans.length && st.trans.some(x=>x&&x.trim());
      html += hasT
        ? `<div class="trans">${st.trans.map(l=>`<span class="line">${l||"&nbsp;"}</span>`).join("")}</div>`
        : `<div class="trans empty">待译…</div>`;
      html += `</div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="placeholder">
      <p>这首《${s.t}》还没有录入歌词。</p>
      <p class="how">把它的原文歌词贴给 Claude，就会翻译好、按原文／中文逐段对照填进这里。</p>
    </div>`;
  }

  main.innerHTML = html;
  main.scrollIntoView({behavior:"smooth", block:"start"});
  // collapse mobile nav after pick
  if (window.matchMedia("(max-width: 860px)").matches){
    sideInner.classList.add("collapsed");
    mobileBar.setAttribute("aria-expanded","false");
    mobileCaret.textContent = "▸";
  }
  try { localStorage.setItem("cc_last", ai+","+si); } catch(e){}
}

// 单语言码 → 中文名（一码一名；多语言由 lang 数组的多个码组成）
const LANG_NAMES = {
  EN:"英语", FR:"法语", BR:"布列塔尼语", GA:"爱尔兰语", GD:"苏格兰盖尔语",
  SCO:"苏格兰语", IT:"意大利语", LA:"拉丁语", ES:"西班牙语", LAD:"拉迪诺语",
  JP:"日语", HE:"希伯来语", TR:"土耳其语", "Instr.":"器乐"
};
function langCodes(lang){            // 归一成码数组，兼容旧的字符串/斜杠写法
  if (Array.isArray(lang)) return lang;
  if (!lang) return [];
  return String(lang).split("/").map(s=>s.trim()).filter(Boolean);
}
function langLabel(lang){            // 短码串，导航用，如 "FR·EN"
  return langCodes(lang).join("·");
}
function langName(lang){             // 中文名串，标题栏用，如 " · 法语 · 英语"
  const codes = langCodes(lang);
  if (!codes.length) return " · —";
  return " · " + codes.map(c => LANG_NAMES[c] || c).join(" · ");
}

/* mobile toggle */
const sideInner = document.getElementById("sideInner");
const mobileBar = document.getElementById("mobileBar");
const mobileCaret = document.getElementById("mobileCaret");
mobileBar.addEventListener("click", () => {
  const c = sideInner.classList.toggle("collapsed");
  mobileBar.setAttribute("aria-expanded", String(!c));
  mobileCaret.textContent = c ? "▸" : "▾";
});

buildNav();
// open last-viewed, else the demo song (Jenovefa)
let start = [3,3];
try {
  const saved = localStorage.getItem("cc_last");
  if (saved){ const [a,b]=saved.split(",").map(Number);
    if (ALBUMS[a] && ALBUMS[a].songs[b]) start=[a,b]; }
} catch(e){}
selectSong(start[0], start[1]);
</script>
